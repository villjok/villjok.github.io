<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Задание # 2 - Таблицы</title>
    <style>
        table {
            table-layout: fixed;
            width: 380px;
            border-collapse: collapse;
        }
        td, th {
            border: 1px solid black;
            padding: 15px;
            text-align: center;
            vertical-align: middle;
            height: 65px;
        }
        h2 {
            margin-top: 30px;
        }
    </style>
</head>
<body>

<h1>Задание # 2 — Таблицы</h1>

<h2>1-я таблица</h2>
<table>
   <tr>
    <th rowspan="3">1</th>
    <td colspan="2">2</td>
   </tr>
   <tr>
     <td>5</td>
     <td>6</td>
   </tr>
</table>

<h2>2-я таблица</h2>
<table>
   <tr>
    <th colspan="2">1</th>
   </tr>
   <tr>
    <td rowspan="2">3</td>
     <td>4</td>
   </tr>
   <tr>
     <td>6</td>
   </tr>
</table>

<h2>3-я таблица</h2>
<table>
   <tr>
      <td>1</td>
      <td>2</td>
      <td>3</td>
   </tr>
   <tr>
      <td colspan="2">5</td>
      <td></td>
   </tr>
</table>

<h2>4-я таблица</h2>
<table>
   <tr>
    <th colspan="2">1</th>
   </tr>
   <tr>
     <td>3</td>
     <td>4</td>
   </tr>
   <tr>
    <td colspan="2">5</td>
   </tr>
</table>

</body>
</html>
